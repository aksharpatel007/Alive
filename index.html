<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>SignalScope API Test</title>

        <style>
            body {
                  font-family: Arial, sans-serif;
                        max-width: 700px;
                              margin: 50px auto;
                                    padding: 20px;
                                        }

                                            button {
                                                  padding: 10px 18px;
                                                        cursor: pointer;
                                                            }

                                                                pre {
                                                                      background: #f4f4f4;
                                                                            padding: 15px;
                                                                                  border-radius: 8px;
                                                                                        overflow: auto;
                                                                                            }
                                                                                              </style>
                                                                                              </head>

                                                                                              <body>

                                                                                                <h1>SignalScope API</h1>

                                                                                                  <button onclick="sendRequest()">
                                                                                                      Send Request
                                                                                                        </button>

                                                                                                          <pre id="result">Response will appear here...</pre>

                                                                                                            <script>
                                                                                                                const API_URL = "https://signalscope-1.onrender.com";

                                                                                                                    async function sendRequest() {
                                                                                                                          const result = document.getElementById("result");

                                                                                                                                result.textContent = "Sending request...";

                                                                                                                                      try {
                                                                                                                                              const response = await fetch(API_URL, {
                                                                                                                                                        method: "GET",
                                                                                                                                                                  headers: {
                                                                                                                                                                              "Content-Type": "application/json"
                                                                                                                                                                                        }
                                                                                                                                                                                                });

                                                                                                                                                                                                        const text = await response.text();

                                                                                                                                                                                                                let data;

                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                  data = JSON.parse(text);
                                                                                                                                                                                                                                          } catch {
                                                                                                                                                                                                                                                    data = text;
                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                    if (!response.ok) {
                                                                                                                                                                                                                                                                              throw new Error(
                                                                                                                                                                                                                                                                                          `HTTP ${response.status}: ${JSON.stringify(data)}`
                                                                                                                                                                                                                                                                                                    );
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                    result.textContent = JSON.stringify(data, null, 2);

                                                                                                                                                                                                                                                                                                                          } catch (error) {
                                                                                                                                                                                                                                                                                                                                  console.error(error);

                                                                                                                                                                                                                                                                                                                                          result.textContent =
                                                                                                                                                                                                                                                                                                                                                    "Request failed:\n\n" + error.message;
                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                </html>
