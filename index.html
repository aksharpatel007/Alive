<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>SignalScope API Test</title>  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      background: #ffffff;
      color: #222222;
    }

    h1 {
      margin-bottom: 8px;
    }

    .status {
      margin: 20px 0;
      padding: 12px 15px;
      border-radius: 8px;
      background: #f4f4f4;
      font-weight: bold;
    }

    .success {
      background: #e8f7e8;
      color: #187a18;
    }

    .error {
      background: #ffe8e8;
      color: #b00020;
    }

    .loading {
      background: #fff5d6;
      color: #8a6500;
    }

    pre {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 8px;
      overflow: auto;
      min-height: 100px;
    }

    .info {
      color: #666;
      font-size: 14px;
    }
  </style></head><body>  <h1>SignalScope API</h1>  <p class="info">
    Automatic API connectivity test
  </p>  <div id="status" class="status loading">
    Connecting to SignalScope API...
  </div>  <pre id="result">Waiting for response...</pre>  <script>
    const API_URL = "https://signalscope-1.onrender.com";

    async function testAPI() {
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      status.className = "status loading";
      status.textContent = "Connecting to SignalScope API...";
      result.textContent = "Sending GET request...";

      try {
        const startTime = performance.now();

        const response = await fetch(API_URL, {
          method: "GET",
          headers: {
            "Content-Type": "application/json"
          }
        });

        const endTime = performance.now();
        const responseTime = Math.round(endTime - startTime);

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch {
          data = text;
        }

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}: ${JSON.stringify(data)}`
          );
        }

        status.className = "status success";
        status.textContent =
          `API Connected Successfully ✓ (${responseTime} ms)`;

        result.textContent = JSON.stringify(
          {
            status: response.status,
            statusText: response.statusText,
            responseTime: `${responseTime} ms`,
            data: data
          },
          null,
          2
        );

      } catch (error) {
        console.error("API Error:", error);

        status.className = "status error";
        status.textContent = "API Connection Failed ✕";

        result.textContent =
          "Request failed:\n\n" + error.message;
      }
    }

    window.addEventListener("load", testAPI);
  </script></body>
</html>                                                                                                                                                                                                                                                           </script>

                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                </html>
